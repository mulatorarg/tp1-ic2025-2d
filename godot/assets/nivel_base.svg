<?xml version="1.0" encoding="utf-8"?>
<svg width="1366" height="768" viewBox="0 0 1366 768" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- Fondo -->
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#bfefff"/>
      <stop offset="1" stop-color="#9fd6b8"/>
    </linearGradient>
    <linearGradient id="water" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#78c7e6"/>
      <stop offset="1" stop-color="#54a6c0"/>
    </linearGradient>
    <linearGradient id="hutRoof" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e3b15a"/>
      <stop offset="1" stop-color="#c58f3f"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#d6a76b"/>
      <stop offset="1" stop-color="#c89252"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1366" height="768" fill="url(#sky)"/>
  <!-- Distant treeline -->
  <g id="horizon">
    <rect x="0" y="180" width="1366" height="130" fill="#9ad08a"/>
    <g fill="#6fb06b">
      <ellipse cx="120" cy="230" rx="120" ry="48"/>
      <ellipse cx="300" cy="220" rx="150" ry="60"/>
      <ellipse cx="600" cy="210" rx="220" ry="80"/>
      <ellipse cx="980" cy="215" rx="160" ry="64"/>
      <ellipse cx="1250" cy="225" rx="120" ry="48"/>
    </g>
  </g>

  <!-- River -->
  <g id="river">
    <path d="M0 260 C220 240, 420 240, 680 260 C920 280, 1100 300, 1366 260 L1366 330 L0 330 Z" fill="url(#water)"/>
    <path d="M0 290 C220 270, 420 270, 680 290 C920 310, 1100 330, 1366 290" fill="#8fd6e9" opacity="0.35"/>
  </g>

  <!-- Foreground grass -->
  <rect x="0" y="330" width="1366" height="438" fill="#7fc06b"/>

  <!-- Grid (board) parameters -->
  <!-- We'll center the grid horizontally with slight offset to right so hut on left is near edge -->
  <!-- Grid: 7 cols x 5 rows, each tile 120x100, spacing 8 -->
  <g id="board" transform="translate(360,380)">
    <!-- board background shadow -->
    <rect x="-12" y="-12" width="892" height="532" rx="8" fill="rgba(0,0,0,0.03)"/>
    <!-- tiles container (no perspective) -->
    <g id="tiles">
      <!-- parameters -->
      <!-- tileWidth = 120; tileHeight = 100; cols=7; rows=5; gap=8 -->
      <!-- draw tiles -->
      <!-- Use nested loops conceptually - here expanded -->
      <!-- Row 0 -->
      <g id="row0" transform="translate(0,0)">
        <rect x="0" y="0" width="120" height="100" rx="10" fill="url(#tile)" stroke="#8f6b3b" stroke-width="4" />
        <rect x="128" y="0" width="120" height="100" rx="10" fill="url(#tile)" stroke="#8f6b3b" stroke-width="4" />
        <rect x="256" y="0" width="120" height="100" rx="10" fill="url(#tile)" stroke="#8f6b3b" stroke-width="4" />
        <rect x="384" y="0" width="120" height="100" rx="10" fill="url(#tile)" stroke="#8f6b3b" stroke-width="4" />
        <rect x="512" y="0" width="120" height="100" rx="10" fill="url(#tile)" stroke="#8f6b3b" stroke-width="4" />
        <rect x="640" y="0" width="120" height="100" rx="10" fill="url(#tile)" stroke="#8f6b3b" stroke-width="4" />
        <rect x="768" y="0" width="120" height="100" rx="10" fill="url(#tile)" stroke="#8f6b3b" stroke-width="4" />
      </g>
      <!-- Row 1 -->
      <g id="row1" transform="translate(0,108)">
        <rect x="0" y="0" width="120" height="100" rx="10" fill="url(#tile)" stroke="#8f6b3b" stroke-width="4" />
        <rect x="128" y="0" width="120" height="100" rx="10" fill="url(#tile)" stroke="#8f6b3b" stroke-width="4" />
        <rect x="256" y="0" width="120" height="100" rx="10" fill="url(#tile)" stroke="#8f6b3b" stroke-width="4" />
        <rect x="384" y="0" width="120" height="100" rx="10" fill="url(#tile)" stroke="#8f6b3b" stroke-width="4" />
        <rect x="512" y="0" width="120" height="100" rx="10" fill="url(#tile)" stroke="#8f6b3b" stroke-width="4" />
        <rect x="640" y="0" width="120" height="100" rx="10" fill="url(#tile)" stroke="#8f6b3b" stroke-width="4" />
        <rect x="768" y="0" width="120" height="100" rx="10" fill="url(#tile)" stroke="#8f6b3b" stroke-width="4" />
      </g>
      <!-- Row 2 -->
      <g id="row2" transform="translate(0,216)">
        <rect x="0" y="0" width="120" height="100" rx="10" fill="url(#tile)" stroke="#8f6b3b" stroke-width="4" />
        <rect x="128" y="0" width="120" height="100" rx="10" fill="url(#tile)" stroke="#8f6b3b" stroke-width="4" />
        <rect x="256" y="0" width="120" height="100" rx="10" fill="url(#tile)" stroke="#8f6b3b" stroke-width="4" />
        <rect x="384" y="0" width="120" height="100" rx="10" fill="url(#tile)" stroke="#8f6b3b" stroke-width="4" />
        <rect x="512" y="0" width="120" height="100" rx="10" fill="url(#tile)" stroke="#8f6b3b" stroke-width="4" />
        <rect x="640" y="0" width="120" height="100" rx="10" fill="url(#tile)" stroke="#8f6b3b" stroke-width="4" />
        <rect x="768" y="0" width="120" height="100" rx="10" fill="url(#tile)" stroke="#8f6b3b" stroke-width="4" />
      </g>
      <!-- Row 3 -->
      <g id="row3" transform="translate(0,324)">
        <rect x="0" y="0" width="120" height="100" rx="10" fill="url(#tile)" stroke="#8f6b3b" stroke-width="4" />
        <rect x="128" y="0" width="120" height="100" rx="10" fill="url(#tile)" stroke="#8f6b3b" stroke-width="4" />
        <rect x="256" y="0" width="120" height="100" rx="10" fill="url(#tile)" stroke="#8f6b3b" stroke-width="4" />
        <rect x="384" y="0" width="120" height="100" rx="10" fill="url(#tile)" stroke="#8f6b3b" stroke-width="4" />
        <rect x="512" y="0" width="120" height="100" rx="10" fill="url(#tile)" stroke="#8f6b3b" stroke-width="4" />
        <rect x="640" y="0" width="120" height="100" rx="10" fill="url(#tile)" stroke="#8f6b3b" stroke-width="4" />
        <rect x="768" y="0" width="120" height="100" rx="10" fill="url(#tile)" stroke="#8f6b3b" stroke-width="4" />
      </g>
      <!-- Row 4 -->
      <g id="row4" transform="translate(0,432)">
        <rect x="0" y="0" width="120" height="100" rx="10" fill="url(#tile)" stroke="#8f6b3b" stroke-width="4" />
        <rect x="128" y="0" width="120" height="100" rx="10" fill="url(#tile)" stroke="#8f6b3b" stroke-width="4" />
        <rect x="256" y="0" width="120" height="100" rx="10" fill="url(#tile)" stroke="#8f6b3b" stroke-width="4" />
        <rect x="384" y="0" width="120" height="100" rx="10" fill="url(#tile)" stroke="#8f6b3b" stroke-width="4" />
        <rect x="512" y="0" width="120" height="100" rx="10" fill="url(#tile)" stroke="#8f6b3b" stroke-width="4" />
        <rect x="640" y="0" width="120" height="100" rx="10" fill="url(#tile)" stroke="#8f6b3b" stroke-width="4" />
        <rect x="768" y="0" width="120" height="100" rx="10" fill="url(#tile)" stroke="#8f6b3b" stroke-width="4" />
      </g>
    </g>
  </g>

  <!-- Hut: placed to the LEFT of the board and vertically centered with board -->
  <!-- Board transform = translate(360,380). Board height spans rows: total tile area height = 5*100 + 4*8 = 524 (approx).
       We'll align hut center to board center (y = 380 + 524/2 ~ 642). Place hut left at x ~ 120 -->
  <g id="hut" transform="translate(80, 642)" filter="url(#softShadow)">
    <!-- hut base -->
    <rect x="0" y="-60" width="180" height="120" rx="8" fill="#b57845" stroke="#8a5b31" stroke-width="4"/>
    <!-- door -->
    <rect x="56" y="-14" width="68" height="74" rx="6" fill="#6d3e21" stroke="#4b2a16" stroke-width="3"/>
    <!-- roof -->
    <path d="M-16 -60 L90 -130 L186 -60 Z" fill="url(#hutRoof)" stroke="#9a6d3f" stroke-width="4"/>
    <!-- roof thatch lines -->
    <g stroke="#c98f4a" stroke-width="2" stroke-linecap="round" opacity="0.9">
      <path d="M-8 -75 Q30 -100 70 -78" />
      <path d="M10 -85 Q50 -120 90 -86" />
      <path d="M48 -96 Q88 -128 130 -98" />
    </g>
    <!-- small plants by hut -->
    <g fill="#4b9a4b">
      <ellipse cx="12" cy="10" rx="14" ry="8"/>
      <ellipse cx="168" cy="20" rx="12" ry="6"/>
    </g>
  </g>

  <!-- Foreground decorative plants (left/right) -->
  <g id="foreground">
    <path d="M12 690 C40 650, 120 650, 140 690 L12 690 Z" fill="#2f8f4a" opacity="0.95"/>
    <path d="M1240 680 C1220 650, 1280 640, 1320 680 L1240 680 Z" fill="#2f8f4a" opacity="0.95"/>
  </g>

  <!-- Legend / helper text (optional, can be removed) -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2b4b2a">
    <text x="12" y="24">Rubí: Guardianes del Litoral — Tablero Nivel 1 (1366×768)</text>
  </g>

</svg>
